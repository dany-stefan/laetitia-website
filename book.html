<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réserver — Laetitia Legrand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta http-equiv="Cache-Control" content="no-store">
  <link rel="stylesheet" href="css/styles.css?v=14">
</head>
<body data-page="book">
  <header class="site-header" data-header></header>
  <section class="section">
    <div class="wrap book-layout">
      <div>
        <h1 data-i18n="book_h"></h1>
        <p data-i18n="book_intro"></p>
        <p class="quiet" data-i18n="book_place"></p>
        <p class="quiet" data-i18n="book_facts"></p>
      </div>
      <form id="book-form" class="card" action="https://formsubmit.co/3acb6ad24925a83b768e11e1d329aa41" method="POST">
        <input type="hidden" name="_subject" value="Séance — Laetitia Legrand">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_autoresponse" value="Votre demande de séance est reçue. Ajoutez l’heure à votre calendrier. Lieu : Pointe-Saint-Charles, Montréal. Un rappel suivra la veille. Annulation : stefan_dany@icloud.com. Ce n’est pas un service du CHUM.">
        <input type="hidden" name="_replyto" value="">
        <input type="hidden" name="_cc" value="">
        <input type="hidden" name="when" value="">
        <input type="hidden" id="slot" name="slot" value="">

        <span data-i18n="book_dur"></span>
        <label><input type="radio" name="duration" value="90" checked> <span data-i18n="dur_90"></span></label>

        <label for="date" data-i18n="book_date"></label>
        <input id="date" name="date" type="date" required>

        <p data-i18n="book_slot"></p>
        <div class="slots" id="slots"></div>

        <label for="name" data-i18n="book_name"></label>
        <input id="name" name="name" required autocomplete="name">

        <label for="email" data-i18n="book_email"></label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label for="language" data-i18n="book_lang"></label>
        <select id="language" name="language">
          <option value="fr" data-i18n="lang_fr"></option>
          <option value="en" data-i18n="lang_en"></option>
          <option value="es" data-i18n="lang_es"></option>
        </select>

        <label for="topic" data-i18n="book_topic"></label>
        <select id="topic" name="topic">
          <option value="burnout" data-i18n="s1_t"></option>
          <option value="anxiety" data-i18n="s2_t"></option>
          <option value="sleep" data-i18n="s3_t"></option>
          <option value="grief" data-i18n="s4_t"></option>
          <option value="habits" data-i18n="s5_t"></option>
          <option value="pain" data-i18n="s6_t"></option>
          <option value="addiction" data-i18n="s7_t"></option>
          <option value="phobia" data-i18n="s8_t"></option>
          <option value="perinatal" data-i18n="s9_t"></option>
          <option value="depression" data-i18n="s10_t"></option>
          <option value="trauma" data-i18n="s11_t"></option>
        </select>

        <label for="notes" data-i18n="book_notes"></label>
        <textarea id="notes" name="notes" rows="3"></textarea>

        <p><button class="btn" type="submit" data-i18n="book_submit"></button></p>
      </form>
    </div>
  </section>
  <footer class="site-footer">
    <p data-i18n="disclaimer"></p>
    <p data-i18n="footer"></p>
  </footer>
  <script src="js/i18n.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
  <script src="js/book.js?v=14"></script>
</body>
</html>
